name: Build Firmware Flasher

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: firmware_flasher
            asset_name: firmware_flasher-linux
          - os: macos-latest
            artifact_name: firmware_flasher
            asset_name: firmware_flasher-macos
          - os: windows-latest
            artifact_name: firmware_flasher.exe
            asset_name: firmware_flasher-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tkinter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: pip install -r extras/firmware-flasher/requirements.txt pyinstaller

      - name: Build with PyInstaller
        working-directory: extras/firmware-flasher
        run: pyinstaller firmware_flasher.spec

      - name: Stage executable
        shell: bash
        run: |
          mkdir -p extras/firmware-flasher/bin
          mv extras/firmware-flasher/dist/${{ matrix.artifact_name }} extras/firmware-flasher/bin/${{ matrix.asset_name }}

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extras/firmware-flasher/bin/${{ matrix.asset_name }}
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "ci: update ${{ matrix.asset_name }} [skip ci]"
          # Retry loop handles concurrent pushes from parallel matrix jobs
          for i in 1 2 3 4 5; do
            git pull --rebase origin dev && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((i * 3))
          done
